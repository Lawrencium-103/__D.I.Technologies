[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

# Daily HF catalog delta sync (lib/hfCatalog.js -> "hfcatalog" blob store)
[[scheduled.functions]]
  name = "hfcatalog-sync"
  schedule = "0 6 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/engagement/:splat"
  status = 200

# Redirect the default Netlify subdomain to the primary custom domain so
# authority consolidates on dintechnologies.com. Without this, the auto-generated
# ditechnology.netlify.app serves a duplicate copy of every page.
[[redirects]]
  from = "https://ditechnology.netlify.app/*"
  to = "https://dintechnologies.com/:splat"
  status = 301
  force = true

