[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

# Daily HF catalog delta sync (lib/hfCatalog.js -> "hfcatalog" blob store)
[[scheduled.functions]]
  name = "hfcatalog-sync"
  schedule = "0 6 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/engagement/:splat"
  status = 200

# Prerendered static pages (SEO/GEO: serve real HTML with per-route meta tags)
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
[[redirects]]
  from = "/framework"
  to = "/framework.html"
  status = 200
[[redirects]]
